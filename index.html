<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebTalk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="auth-screen">
            <h1>WebTalk</h1>
            <p>Simple messaging. Photos. Files.</p>
            <form id="auth-form" autocomplete="on">
                <input type="text" id="username" name="username" placeholder="Username" required minlength="3" maxlength="30" autocomplete="username">
                <input type="password" id="password" name="password" placeholder="Password" required minlength="8" maxlength="15" autocomplete="current-password">
                <button type="submit">Continue</button>
            </form>
        </div>
    </div>
</body>
</html>
