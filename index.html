<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebTalk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">

        <!-- JOIN SCREEN -->
        <div id="auth-screen">
            <h1>WebTalk</h1>
            <p>Simple messaging. Photos. Files.</p>
            <button id="join-btn">Join WebTalk</button>
            <p class="hint">You’ll get a random name you can change later</p>
        </div>

        <!-- MAIN APP -->
        <div id="chat-screen" class="hidden">

            <!-- Sidebar -->
            <aside id="sidebar">
                <div class="sidebar-header">
                    <h2>WebTalk</h2>
                    <button id="theme-toggle" title="Toggle light/dark">🌙</button>
                </div>

                <!-- Your profile -->
                <div id="my-profile">
                    <div class="profile-top">
                        <div id="my-avatar" class="avatar big" title="Change profile picture">?</div>
                        <input type="file" id="avatar-input" accept="image/*" hidden>
                        <div class="profile-info">
                            <div class="name-row">
                                <span id="my-name">WebTalk-????</span>
                                <button id="change-name-btn" title="Change name">✏️</button>
                            </div>
                            <p id="my-bio" class="bio-text">No bio yet</p>
                            <button id="edit-bio-btn" class="small-btn">Edit bio</button>
                        </div>
                    </div>
                </div>

                <!-- Notifications -->
                <div id="notifications-section">
                    <p class="section-title">
                        Notifications
                        <span id="notif-badge" class="badge hidden">0</span>
                    </p>
                    <div id="notifications-list">
                        <p class="empty-msg">No notifications</p>
                    </div>
                </div>

                <!-- Small search for friends -->
                <div class="search-box small">
                    <input type="text" id="friends-search" placeholder="Search friends...">
                </div>

                <!-- Friends list -->
                <div id="friends-list">
                    <p class="section-title">Friends</p>
                    <div id="friends-container">
                        <!-- friends appear here -->
                    </div>
                </div>
            </aside>

            <!-- Main chat area -->
            <main id="main-chat">
                <!-- Big search for users -->
                <div class="search-box big">
                    <input type="text" id="users-search" placeholder="Search users on WebTalk...">
                    <div id="search-results" class="hidden"></div>
                </div>

                <!-- Current chat header -->
                <div id="chat-with" class="hidden">
                    <span id="chat-with-name">Select a friend to chat</span>
                </div>

                <div id="messages"></div>

                <div id="typing-indicator" class="hidden">
                    <div class="typing-bubble">
                        <span></span><span></span><span></span>
                    </div>
                </div>

                <!-- File preview -->
                <div id="file-preview" class="hidden">
                    <div id="preview-content"></div>
                    <button id="cancel-file" title="Cancel">✕</button>
                </div>

                <footer id="chat-input-area">
                    <button id="emoji-btn" title="Emoji">😊</button>
                    <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" disabled>
                    <label for="file-input" id="file-btn" title="Send photo or file">📎</label>
                    <input type="file" id="file-input" accept="image/*,*/*" hidden>
                    <button id="send-btn" disabled>Send</button>
                </footer>

                <!-- Desktop Emoji Picker -->
                <div id="emoji-picker" class="hidden">
                    <div class="emoji-grid"></div>
                </div>
            </main>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
